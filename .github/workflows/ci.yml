name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Régénérer le corpus (déterministe, seed 42)
        run: python data/generate_corpus.py
      - name: Tests unitaires, API et scénarios Gherkin
        run: pytest -q
      - name: Banc de validation et KPI hebdomadaires
        run: PYTHONPATH=src python -m e2c.cli run
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-kpi
          path: |
            reports/
            docs/bugs.md
